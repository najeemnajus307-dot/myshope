<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Action History | Faith &amp; Fitness</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f1f5f9;min-height:100vh}
.wrap{display:flex;min-height:100vh}
#adminSidebar{flex-shrink:0}
.main{flex:1;padding:20px;overflow-x:hidden}

.page-title{font-size:20px;font-weight:bold;color:#14532d;margin-bottom:18px}

/* ── Filter bar ── */
.card{
  background:#fff;border-radius:12px;padding:18px;
  margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.filter-row{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.filter-row label{font-size:12px;font-weight:bold;color:#475569}
.filter-row input[type=date],
.filter-row select{
  padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:7px;
  font-size:13px;outline:none;
}
.filter-row input:focus,.filter-row select:focus{border-color:#16a34a}
.btn{
  padding:8px 16px;border:none;border-radius:7px;
  font-size:13px;font-weight:bold;cursor:pointer;
}
.btn-green{background:#16a34a;color:#fff}
.btn-gray{background:#f1f5f9;color:#475569;border:1.5px solid #e2e8f0}
.btn:hover{opacity:.88}

/* ── Stats strip ── */
.stats-strip{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;margin-bottom:16px;
}
.stat-box{
  background:#fff;border-radius:10px;padding:14px 12px;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}
.stat-val{font-size:22px;font-weight:bold;color:#14532d}
.stat-lbl{font-size:11px;color:#64748b;margin-top:3px}

/* ── Section title ── */
.section-title{
  font-size:12px;font-weight:bold;letter-spacing:.8px;
  color:#64748b;text-transform:uppercase;
  margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;
}
.count-badge{
  font-size:11px;background:#dcfce7;color:#15803d;
  border-radius:10px;padding:2px 8px;letter-spacing:0;
  font-weight:bold;text-transform:none;
}

/* ── Timeline ── */
.timeline{position:relative;padding-left:28px}
.timeline::before{
  content:"";position:absolute;left:9px;top:0;bottom:0;
  width:2px;background:#e2e8f0;border-radius:2px;
}
.tl-item{
  position:relative;margin-bottom:14px;
}
.tl-dot{
  position:absolute;left:-23px;top:14px;
  width:10px;height:10px;border-radius:50%;
  background:#16a34a;border:2px solid #fff;
  box-shadow:0 0 0 2px #16a34a;
  flex-shrink:0;
}
.tl-dot.ban    { background:#dc2626;box-shadow:0 0 0 2px #dc2626 }
.tl-dot.unban  { background:#16a34a;box-shadow:0 0 0 2px #16a34a }
.tl-dot.task   { background:#0284c7;box-shadow:0 0 0 2px #0284c7 }
.tl-dot.alert  { background:#d97706;box-shadow:0 0 0 2px #d97706 }
.tl-dot.role   { background:#7c3aed;box-shadow:0 0 0 2px #7c3aed }
.tl-dot.login  { background:#64748b;box-shadow:0 0 0 2px #64748b }

.tl-card{
  background:#fff;border:1px solid #e2e8f0;border-radius:10px;
  padding:12px 14px;
}
.tl-card:hover{border-color:#16a34a;box-shadow:0 2px 8px rgba(22,163,74,.08)}

.tl-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.tl-action{
  font-size:13px;font-weight:bold;color:#1e293b;flex:1;
}
.tl-time{font-size:11px;color:#94a3b8;white-space:nowrap}
.tl-admin{
  font-size:11px;color:#fff;font-weight:bold;
  background:#14532d;border-radius:5px;padding:1px 7px;
}
.tl-role-badge{
  font-size:10px;padding:1px 6px;border-radius:10px;font-weight:bold;
}
.tl-role-superadmin{background:#fde047;color:#713f12}
.tl-role-admin{background:#1e3a5f;color:#93c5fd}

.tl-details{font-size:12px;color:#64748b;line-height:1.5}
.tl-page{font-size:10px;color:#94a3b8;margin-top:4px}

/* ── Empty state ── */
.empty{text-align:center;padding:40px;color:#94a3b8}
.empty span{font-size:40px;display:block;margin-bottom:8px}

/* ── Load more ── */
.load-more-wrap{text-align:center;margin-top:8px}

@media(max-width:700px){.wrap{flex-direction:column}}
</style>
<!-- OneSignal Push Notifications -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "05d57d24-d6bc-40ab-8549-ea6dcf506070",
      safari_web_id: "web.onesignal.auto.261dc44c-6b5c-4882-ba5f-51ef0736d918",
      notifyButton: { enable: true },
    });
  });
</script>
</head>
<body>
<div class="wrap">
  <div id="adminSidebar"></div>

  <main class="main">
    <div class="page-title">📜 Action History</div>

    <!-- Stats -->
    <div class="stats-strip" id="statsStrip">
      <div class="stat-box"><div class="stat-val" id="st-total">—</div><div class="stat-lbl">Total Actions</div></div>
      <div class="stat-box"><div class="stat-val" id="st-today">—</div><div class="stat-lbl">Today</div></div>
      <div class="stat-box"><div class="stat-val" id="st-bans">—</div><div class="stat-lbl">Bans</div></div>
      <div class="stat-box"><div class="stat-val" id="st-admins">—</div><div class="stat-lbl">Unique Admins</div></div>
    </div>

    <!-- Filters -->
    <div class="card">
      <div class="filter-row">
        <div>
          <label>Admin</label><br>
          <select id="filterAdmin" style="margin-top:4px">
            <option value="">All admins</option>
          </select>
        </div>
        <div>
          <label>Action type</label><br>
          <select id="filterAction" style="margin-top:4px">
            <option value="">All actions</option>
            <option value="ban">Ban</option>
            <option value="unban">Unban</option>
            <option value="task">Task</option>
            <option value="alert">Alert</option>
            <option value="role">Role change</option>
            <option value="achievement">Achievement</option>
          </select>
        </div>
        <div>
          <label>From</label><br>
          <input type="date" id="filterFrom" style="margin-top:4px">
        </div>
        <div>
          <label>To</label><br>
          <input type="date" id="filterTo" style="margin-top:4px">
        </div>
        <div style="margin-top:20px;display:flex;gap:8px">
          <button class="btn btn-green" onclick="applyFilter()">Apply</button>
          <button class="btn btn-gray"  onclick="clearFilter()">Clear</button>
        </div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="card">
      <div class="section-title">
        Activity Log
        <span class="count-badge" id="showingCount">0 entries</span>
      </div>
      <div class="timeline" id="timeline">
        <div class="empty"><span>⏳</span>Loading…</div>
      </div>
      <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
        <button class="btn btn-gray" onclick="loadMore()">Load more</button>
      </div>
    </div>
  </main>
</div>

<script type="module">
import "./admin-nav.js";
import { db } from "./firebase.js";
import {
  collection, getDocs, query, orderBy, limit, startAfter
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const PAGE_SIZE = 50;
let allEntries = [];      // all loaded from Firestore
let filtered   = [];      // after filters
let displayed  = 0;       // how many currently rendered
let lastSnap   = null;

/* ── Load all history ── */
async function loadHistory(){
  const snap = await getDocs(
    query(collection(db,"adminHistory"), orderBy("timestamp","desc"))
  );

  allEntries = [];
  snap.forEach(d => allEntries.push({id:d.id,...d.data()}));

  // Populate admin filter dropdown
  const admins = [...new Set(allEntries.map(e=>e.adminName).filter(Boolean))];
  const sel = document.getElementById("filterAdmin");
  admins.forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });

  // Stats
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("st-total").textContent  = allEntries.length;
  document.getElementById("st-today").textContent  = allEntries.filter(e=>e.timestamp?.startsWith(today)).length;
  document.getElementById("st-bans").textContent   = allEntries.filter(e=>e.action?.toLowerCase().includes("ban")).length;
  document.getElementById("st-admins").textContent = new Set(allEntries.map(e=>e.adminPhone)).size;

  filtered = allEntries;
  renderList(true);
}

/* ── Filter ── */
window.applyFilter = () => {
  const adminF  = document.getElementById("filterAdmin").value;
  const actionF = document.getElementById("filterAction").value.toLowerCase();
  const fromF   = document.getElementById("filterFrom").value;
  const toF     = document.getElementById("filterTo").value;

  filtered = allEntries.filter(e => {
    if(adminF  && e.adminName !== adminF) return false;
    if(actionF && !(e.action||"").toLowerCase().includes(actionF)) return false;
    const dateStr = (e.timestamp||"").split("T")[0];
    if(fromF && dateStr < fromF) return false;
    if(toF   && dateStr > toF)   return false;
    return true;
  });
  renderList(true);
};

window.clearFilter = () => {
  document.getElementById("filterAdmin").value  = "";
  document.getElementById("filterAction").value = "";
  document.getElementById("filterFrom").value   = "";
  document.getElementById("filterTo").value     = "";
  filtered = allEntries;
  renderList(true);
};

/* ── Render ── */
function renderList(reset){
  const tl = document.getElementById("timeline");
  if(reset){
    displayed = 0;
    tl.innerHTML = "";
  }

  document.getElementById("showingCount").textContent =
    filtered.length + " entr" + (filtered.length===1?"y":"ies");

  if(filtered.length === 0){
    tl.innerHTML = `<div class="empty"><span>📭</span>No actions recorded yet.<br><small style="font-size:12px;margin-top:6px;display:block">Actions like banning users, creating tasks, and sending alerts will appear here.</small></div>`;
    document.getElementById("loadMoreWrap").style.display = "none";
    return;
  }

  const batch = filtered.slice(displayed, displayed + PAGE_SIZE);
  batch.forEach(e => {
    const item = document.createElement("div");
    item.className = "tl-item";

    const dotClass = getDotClass(e.action||"");
    const timeStr  = formatTime(e.timestamp);
    const roleBadge = e.adminRole === "superadmin"
      ? `<span class="tl-role-badge tl-role-superadmin">⭐ Superadmin</span>`
      : `<span class="tl-role-badge tl-role-admin">Admin</span>`;

    item.innerHTML = `
      <div class="tl-dot ${dotClass}"></div>
      <div class="tl-card">
        <div class="tl-header">
          <span class="tl-admin">${escHtml(e.adminName||"Admin")}</span>
          ${roleBadge}
          <span class="tl-action">${escHtml(e.action||"Action")}</span>
          <span class="tl-time">${timeStr}</span>
        </div>
        ${e.details ? `<div class="tl-details">${escHtml(e.details)}</div>` : ""}
        ${e.page    ? `<div class="tl-page">📄 ${e.page}</div>` : ""}
      </div>
    `;
    tl.appendChild(item);
  });

  displayed += batch.length;
  document.getElementById("loadMoreWrap").style.display =
    displayed < filtered.length ? "block" : "none";
}

window.loadMore = () => renderList(false);

/* ── Helpers ── */
function getDotClass(action){
  const a = action.toLowerCase();
  if(a.includes("unban"))       return "unban";
  if(a.includes("ban"))         return "ban";
  if(a.includes("task"))        return "task";
  if(a.includes("alert"))       return "alert";
  if(a.includes("role") || a.includes("admin")) return "role";
  return "";
}

function formatTime(ts){
  if(!ts) return "—";
  try{
    const d = new Date(ts);
    const date = d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
    const time = d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    return `${date} · ${time}`;
  }catch(e){ return ts; }
}

function escHtml(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

loadHistory();
</script>
</body>
</html>
