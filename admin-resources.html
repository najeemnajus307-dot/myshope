<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Resources | Faith &amp; Fitness</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f1f5f9;min-height:100vh}
.wrap{display:flex;min-height:100vh}
#adminSidebar{flex-shrink:0}
.main{flex:1;padding:20px;overflow-x:hidden}

.page-title{font-size:20px;font-weight:bold;color:#14532d;margin-bottom:6px}
.page-sub{font-size:13px;color:#64748b;margin-bottom:18px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.section-title{font-size:12px;font-weight:bold;letter-spacing:.8px;color:#64748b;text-transform:uppercase;margin-bottom:14px}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.field-row{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:12px;font-weight:bold;color:#475569}
input[type=text],input[type=url],select,textarea{
  width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:14px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:#16a34a}
textarea{min-height:70px;resize:vertical}

/* Image picker */
.img-preview{
  width:100%;max-height:180px;object-fit:contain;
  border-radius:8px;margin-top:10px;display:none;
  border:1.5px solid #e2e8f0;background:#f1f5f9;padding:4px;
}
.img-hint{
  font-size:11px;color:#94a3b8;margin-top:5px;line-height:1.6;
}
.img-select-wrap{
  position:relative;display:flex;gap:8px;align-items:center;
}
.img-select-wrap select{flex:1}
.img-refresh-btn{
  padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:7px;
  background:#f8fafc;cursor:pointer;font-size:14px;flex-shrink:0;
  color:#475569;font-weight:bold;
}
.img-refresh-btn:hover{background:#e2e8f0}

/* Type toggle */
.type-toggle{display:flex;gap:8px;margin-top:4px}
.type-btn{
  padding:6px 14px;border:1.5px solid #e2e8f0;border-radius:6px;
  font-size:13px;font-weight:bold;cursor:pointer;background:#f8fafc;color:#475569;
}
.type-btn.on{background:#16a34a;color:#fff;border-color:#16a34a}

/* Buttons */
.btn{padding:9px 18px;border:none;border-radius:7px;font-size:13px;font-weight:bold;cursor:pointer}
.btn-green{background:#16a34a;color:#fff}
.btn-green:hover{opacity:.88}
.btn-gray{background:#f1f5f9;color:#475569}
.form-actions{display:flex;gap:8px;margin-top:12px}
.form-actions .btn{flex:1}
.save-msg{font-size:13px;text-align:center;margin-top:8px;min-height:18px;color:#16a34a}
.save-err{color:#dc2626}

/* Resource cards */
.category-section{margin-bottom:20px}
.category-title{
  font-size:15px;font-weight:bold;color:#14532d;
  padding:10px 14px;background:#dcfce7;border-radius:8px;
  margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;
}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.res-card{
  background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;
  overflow:hidden;
}
.res-thumb{width:100%;aspect-ratio:16/9;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:32px}
.res-thumb img{width:100%;height:100%;object-fit:cover}
.res-body{padding:12px}
.res-title{font-size:14px;font-weight:bold;color:#1e293b;margin-bottom:4px}
.res-desc{font-size:12px;color:#64748b;line-height:1.5}
.res-type-badge{
  display:inline-block;font-size:10px;font-weight:bold;
  padding:2px 7px;border-radius:5px;margin-bottom:6px;
}
.res-type-youtube{background:#fee2e2;color:#dc2626}
.res-type-image{background:#dbeafe;color:#1d4ed8}
.res-actions{display:flex;gap:6px;margin-top:10px}
.btn-sm{padding:4px 9px;border:none;border-radius:5px;font-size:12px;font-weight:bold;cursor:pointer}
.btn-del{background:#fee2e2;color:#dc2626}
.btn-edit-r{background:#dbeafe;color:#1d4ed8}

.empty-cat{font-size:13px;color:#94a3b8;text-align:center;padding:24px}
.loading{text-align:center;padding:32px;color:#94a3b8;font-size:14px}

@media(max-width:700px){.wrap{flex-direction:column}.form-grid{grid-template-columns:1fr}}
</style>
<!-- OneSignal Push Notifications -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "05d57d24-d6bc-40ab-8549-ea6dcf506070",
      safari_web_id: "web.onesignal.auto.261dc44c-6b5c-4882-ba5f-51ef0736d918",
      notifyButton: { enable: true },
    });
  });
</script>
</head>
<body>
<div class="wrap">
  <div id="adminSidebar"></div>
  <main class="main">
    <div class="page-title">📚 Resource Manager</div>
    <div class="page-sub">Add videos and images to help users perform tasks correctly</div>

    <!-- ── Add / Edit Form ── -->
    <div class="card">
      <div class="section-title" id="formTitle">Add New Resource</div>
      <div class="form-grid">

        <div class="field-row full">
          <label class="field-label">Task Category</label>
          <select id="f_task">
            <option value="">Loading tasks…</option>
          </select>
        </div>

        <div class="field-row full">
          <label class="field-label">Resource Type</label>
          <div class="type-toggle">
            <span class="type-btn on" id="typeBtnYT"    onclick="setType('youtube')">▶ YouTube Video</span>
            <span class="type-btn"    id="typeBtnImage" onclick="setType('image')">🖼 Image</span>
          </div>
        </div>

        <div class="field-row full">
          <label class="field-label">Title</label>
          <input type="text" id="f_title" placeholder="e.g. How to perform Fajr prayer correctly">
        </div>

        <!-- YouTube URL (shown when type=youtube) -->
        <div class="field-row full" id="ytUrlRow">
          <label class="field-label">YouTube URL</label>
          <input type="url" id="f_url" placeholder="https://www.youtube.com/watch?v=…">
        </div>

        <!-- Image picker (shown when type=image) -->
        <div class="field-row full" id="imgUploadRow" style="display:none">
          <label class="field-label">Select Image</label>
          <div class="img-select-wrap">
            <select id="f_image_name" onchange="previewImageName(this.value)">
              <option value="">— Loading images… —</option>
            </select>
            <button class="img-refresh-btn" onclick="loadImageList()" title="Refresh image list">↻</button>
          </div>
          <div class="img-hint">
            📁 Add images to the <b>images/</b> folder and add their filename to <b>images/manifest.json</b>, then click ↻ to refresh.
          </div>
          <img id="imgPreview" class="img-preview" alt="preview">
        </div>

        <div class="field-row full">
          <label class="field-label">Description</label>
          <textarea id="f_desc" placeholder="Brief description of what this resource covers…"></textarea>
        </div>

      </div>
      <div class="form-actions">
        <button class="btn btn-gray" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
        <button class="btn btn-green" onclick="saveResource()">Save Resource</button>
      </div>
      <div class="save-msg" id="formMsg"></div>
    </div>

    <!-- ── Resources list ── -->
    <div id="resourceList">
      <div class="loading">Loading resources…</div>
    </div>

  </main>
</div>

<script type="module">
import "./admin-nav.js";
import { db } from "./firebase.js";
import {
  collection, getDocs, addDoc, updateDoc, deleteDoc, doc, orderBy, query
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

let tasks     = [];
let resources = [];
let editId    = null;
let curType   = "youtube";

/* ── Load image list from manifest.json ── */
window.loadImageList = async (selectValue) => {
  const sel = document.getElementById("f_image_name");
  try{
    const res  = await fetch("images/manifest.json?_=" + Date.now());
    const list = await res.json();  // array of filenames
    sel.innerHTML = `<option value="">— Select an image —</option>` +
      list.map(f => `<option value="${f}">${f}</option>`).join("");
    if(selectValue) sel.value = selectValue;
    previewImageName(sel.value);
  }catch(e){
    sel.innerHTML = `<option value="">⚠️ Could not load images/manifest.json</option>`;
  }
};

/* ── Preview selected image ── */
window.previewImageName = (name) => {
  const preview = document.getElementById("imgPreview");
  if(!name){ preview.style.display = "none"; return; }
  preview.src           = "images/" + name;
  preview.style.display = "block";
  preview.onerror       = () => { preview.style.display = "none"; };
  preview.onload        = () => { preview.style.display = "block"; };
};

/* ── Set type toggle ── */
window.setType = (type) => {
  curType = type;
  document.getElementById("typeBtnYT").classList.toggle("on",    type==="youtube");
  document.getElementById("typeBtnImage").classList.toggle("on", type==="image");
  document.getElementById("ytUrlRow").style.display      = type==="youtube" ? "flex" : "none";
  document.getElementById("imgUploadRow").style.display  = type==="image"   ? "flex" : "none";
};

/* ── Load tasks for dropdown ── */
async function loadTasks(){
  const snap = await getDocs(collection(db,"tasks"));
  tasks = [];
  snap.forEach(d => tasks.push({id:d.id, text:d.data().text||"(unnamed)"}));
  tasks.sort((a,b)=>a.text.localeCompare(b.text));

  const sel = document.getElementById("f_task");
  sel.innerHTML = `<option value="">— Select task category —</option>` +
    tasks.map(t=>`<option value="${t.id}">${escHtml(t.text)}</option>`).join("");
}

/* ── Load resources ── */
async function loadResources(){
  const snap = await getDocs(query(collection(db,"resources"), orderBy("createdAt","desc")));
  resources = [];
  snap.forEach(d => resources.push({id:d.id,...d.data()}));
  renderResources();
}

function renderResources(){
  const el = document.getElementById("resourceList");

  // Group by taskId
  const grouped = {};
  resources.forEach(r => {
    const key = r.taskId || "__none__";
    if(!grouped[key]) grouped[key]= [];
    grouped[key].push(r);
  });

  if(resources.length===0){
    el.innerHTML=`<div class="card loading">No resources yet. Add the first one above!</div>`;
    return;
  }

  el.innerHTML = "";
  Object.entries(grouped).forEach(([taskId, items])=>{
    const taskObj  = tasks.find(t=>t.id===taskId);
    const taskName = taskObj ? taskObj.text : "Uncategorised";

    const section = document.createElement("div");
    section.className = "category-section";
    section.innerHTML = `
      <div class="category-title">
        <span>📂 ${escHtml(taskName)}</span>
        <span style="font-size:12px;color:#16a34a;font-weight:normal">${items.length} resource${items.length!==1?"s":""}</span>
      </div>
      <div class="res-grid" id="grid-${taskId}"></div>
    `;
    el.appendChild(section);

    const grid = section.querySelector(".res-grid");
    items.forEach(r => {
      const isYT   = r.type==="youtube";
      const thumbHtml = isYT
        ? `<div class="res-thumb">${getYTThumb(r.url)}</div>`
        : `<div class="res-thumb"><img src="${escHtml(r.url||"")}" onerror="this.parentNode.innerHTML='🖼'" alt="${escHtml(r.title||"")}"></div>`;

      const card = document.createElement("div");
      card.className = "res-card";
      card.innerHTML = `
        ${thumbHtml}
        <div class="res-body">
          <span class="res-type-badge res-type-${r.type||"youtube"}">${isYT?"▶ YouTube":"🖼 Image"}</span>
          <div class="res-title">${escHtml(r.title||"Untitled")}</div>
          <div class="res-desc">${escHtml(r.description||"")}</div>
          <div class="res-actions">
            <button class="btn-sm btn-edit-r" onclick='openEditRes(${JSON.stringify(r)})'>Edit</button>
            <button class="btn-sm btn-del" onclick="deleteResource('${r.id}')">Delete</button>
            ${isYT && r.url ? `<a href="${escHtml(r.url)}" target="_blank" class="btn-sm" style="background:#f1f5f9;color:#475569;text-decoration:none">Open ↗</a>` : ""}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  });
}

function getYTThumb(url){
  if(!url) return "▶";
  const m = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  if(!m) return "▶";
  return `<img src="https://img.youtube.com/vi/${m[1]}/mqdefault.jpg" style="width:100%;height:100%;object-fit:cover" alt="thumbnail">`;
}

/* ── Save resource ── */
window.saveResource = async () => {
  const msg    = document.getElementById("formMsg");
  const taskId = document.getElementById("f_task").value;
  const title  = document.getElementById("f_title").value.trim();
  const desc   = document.getElementById("f_desc").value.trim();

  msg.className = "save-msg save-err";
  if(!taskId){ msg.textContent = "Select a task category."; return; }
  if(!title)  { msg.textContent = "Enter a title.";          return; }

  let url = "";

  if(curType === "youtube"){
    url = document.getElementById("f_url").value.trim();
    if(!url){ msg.textContent = "Enter a YouTube URL."; return; }
  } else {
    const fname = document.getElementById("f_image_name").value.trim();
    if(!fname){ msg.textContent = "Enter the image filename."; return; }
    url = "images/" + fname;
  }

  const data = { taskId, type: curType, title, url, description: desc };

  if(editId){
    await updateDoc(doc(db,"resources",editId), data);
    msg.className   = "save-msg";
    msg.textContent = "Updated ✅";
    if(window.logAdminAction) logAdminAction("Edited resource", `"${title}"`);
  } else {
    data.createdAt = new Date().toISOString();
    await addDoc(collection(db,"resources"), data);
    msg.className   = "save-msg";
    msg.textContent = "Resource added ✅";
    if(window.logAdminAction) logAdminAction("Added resource", `"${title}" (${curType})`);
  }

  cancelEdit();
  loadResources();
};

/* ── Open edit ── */
window.openEditRes = (r) => {
  editId = r.id;
  document.getElementById("formTitle").textContent   = "Edit Resource";
  document.getElementById("cancelBtn").style.display = "block";
  document.getElementById("f_task").value            = r.taskId || "";
  document.getElementById("f_title").value           = r.title  || "";
  document.getElementById("f_url").value             = r.url    || "";
  document.getElementById("f_desc").value            = r.description || "";
  setType(r.type || "youtube");

  // Pre-select image in dropdown
  if(r.type === "image" && r.url){
    const fname = r.url.replace(/^images\//, "");
    loadImageList(fname);
  }

  window.scrollTo({top:0,behavior:"smooth"});
};

/* ── Cancel edit ── */
window.cancelEdit = () => {
  editId = null;
  document.getElementById("formTitle").textContent      = "Add New Resource";
  document.getElementById("cancelBtn").style.display    = "none";
  document.getElementById("f_task").value               = "";
  document.getElementById("f_title").value              = "";
  document.getElementById("f_url").value                = "";
  document.getElementById("f_image_name").selectedIndex = 0;
  document.getElementById("f_desc").value               = "";
  document.getElementById("imgPreview").style.display   = "none";
  document.getElementById("imgNotFound").style.display  = "none";
  document.getElementById("formMsg").textContent        = "";
  setType("youtube");
};

/* ── Delete resource ── */
window.deleteResource = async (id) => {
  if(!confirm("Delete this resource?")) return;
  await deleteDoc(doc(db,"resources",id));
  if(window.logAdminAction) logAdminAction("Deleted resource","");
  resources = resources.filter(r=>r.id!==id);
  renderResources();
};

function escHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

Promise.all([loadTasks(), loadResources(), loadImageList()]);
</script>
</body>
</html>
