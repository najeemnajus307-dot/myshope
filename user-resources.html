<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library | Faith &amp; Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ecebf4;--surface:#ecebf4;--lit:#ffffff;--shade:#b8b9c8;
  --ink:#2a2c3e;--ink-soft:#6b6d82;--ink-mute:#9a9cb0;
  --clay-peach:#ffc89a;--clay-yellow:#ffe08a;--clay-mint:#a8e6cf;
  --clay-sky:#a8c8ff;--clay-lilac:#c5b3ff;--clay-rose:#ff9eb3;
  --accent:#6c5ce7;--accent-soft:#b8aeff;
  --r-lg:28px;--r-md:20px;--r-sm:14px;
  --neu-out:14px 14px 30px var(--shade),-14px -14px 30px var(--lit);
  --neu-out-sm:8px 8px 18px var(--shade),-8px -8px 18px var(--lit);
  --neu-in-sm:inset 4px 4px 10px var(--shade),inset -4px -4px 10px var(--lit);
  --neu-press:inset 6px 6px 14px var(--shade),inset -6px -6px 14px var(--lit);
  --clay-shadow:inset 0 -8px 0 rgba(60,30,80,.10),inset 0 8px 0 rgba(255,255,255,.65);
  --green-deep:#0d4a28;--green-mid:#1c7a3e;--green-leaf:#72b534;
  --green-wash:#dff0d0;--paper-mint:#dff0d6;--paper:#ffffff;
  --paper-2:#f6faf4;--paper-3:#edf5e8;--line:#d6e5d8;--ink-2:#2a3d30;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);min-height:100vh}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);padding-bottom:78px;-webkit-font-smoothing:antialiased}

/* ── Nav ── */
.app-nav{position:fixed;z-index:200;bottom:0;left:0;right:0;background:var(--surface);box-shadow:0 -6px 24px rgba(184,185,200,.55),0 -1px 0 rgba(255,255,255,.9);display:flex;padding:6px 8px max(8px,env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink-mute);gap:3px;padding:6px 4px 4px;border-radius:14px;transition:all .2s}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.nav-item span{font-size:10px;font-weight:600;letter-spacing:.3px}
.nav-item.active{color:var(--green-mid);background:linear-gradient(160deg,rgba(114,181,52,.12),rgba(28,122,62,.08));box-shadow:var(--neu-in-sm)}
.nav-item.active svg{transform:scale(1.15);stroke:var(--green-mid)}


/* ── Top bar ── */
.top-bar{background:var(--surface);padding:18px 22px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 rgba(0,0,0,.04),0 14px 30px -20px rgba(120,120,160,.25)}
.top-bar-inner{flex:1}
.top-bar-eyebrow{font-size:10px;letter-spacing:3px;color:var(--ink-mute);text-transform:uppercase;font-weight:700;margin-bottom:2px}
.top-bar-title{font-family:'Fraunces',serif;font-weight:700;font-size:22px;letter-spacing:-0.5px;color:var(--ink)}
.top-count{font-size:12px;font-weight:700;color:var(--ink-mute);background:var(--surface);box-shadow:var(--neu-in-sm);padding:6px 14px;border-radius:999px}
.icon-btn{width:38px;height:38px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--neu-out-sm);display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);text-decoration:none;transition:all .2s;flex-shrink:0;font-size:15px}
.icon-btn:active{box-shadow:var(--neu-press)}

/* ── Page ── */
.page{max-width:960px;margin:0 auto;padding:22px 18px 48px}

/* ── Search + filter bar ── */
.lib-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.lib-search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--surface);padding:12px 18px;border-radius:999px;box-shadow:var(--neu-in-sm)}
.lib-search input{border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);width:100%}
.lib-search input::placeholder{color:var(--ink-mute)}
.lib-search svg{color:var(--ink-mute);flex-shrink:0}
.lib-filter{display:inline-flex;padding:5px;background:var(--surface);border-radius:999px;box-shadow:var(--neu-in-sm)}
.lib-fbtn{border:0;background:transparent;cursor:pointer;padding:8px 16px;border-radius:999px;font:inherit;font-weight:600;font-size:13px;color:var(--ink-soft);transition:all .25s;white-space:nowrap}
.lib-fbtn.active{background:var(--surface);color:var(--ink);box-shadow:var(--neu-out-sm)}

/* ── Category card ── */
.lib-cat{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--neu-out);padding:20px;margin-bottom:22px}
.lib-cat-head{display:flex;align-items:center;gap:14px;padding:4px 4px 18px;cursor:pointer;user-select:none}
.lib-cat-emoji{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:26px;box-shadow:var(--clay-shadow),5px 6px 12px rgba(0,0,0,.10);flex-shrink:0}
.lib-cat-info{flex:1;min-width:0}
.lib-cat-title{font-family:'Fraunces',serif;font-weight:700;font-size:22px;letter-spacing:-0.3px;line-height:1.1}
.lib-cat-meta{color:var(--ink-soft);font-size:13px;margin-top:4px}
.lib-cat-toggle{width:36px;height:36px;border-radius:50%;background:var(--surface);border:0;cursor:pointer;box-shadow:var(--neu-out-sm);display:grid;place-items:center;color:var(--ink-soft);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);flex-shrink:0}
.lib-cat.collapsed .lib-cat-toggle{transform:rotate(-90deg)}
.lib-cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;overflow:hidden;max-height:4000px;transition:max-height .45s ease,opacity .35s ease,margin .3s ease}
.lib-cat.collapsed .lib-cat-grid{max-height:0;opacity:0;margin-top:-18px}

/* ── Item card ── */
.lib-item{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--neu-out-sm);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s,box-shadow .25s;border:0;text-align:left;width:100%;font:inherit;color:inherit}
.lib-item:hover{transform:translateY(-3px);box-shadow:10px 12px 24px var(--shade),-10px -10px 24px var(--lit)}
.lib-item:active{box-shadow:var(--neu-press);transform:translateY(0)}

/* Thumbnail */
.lib-item-thumb{aspect-ratio:16/10;position:relative;overflow:hidden;display:grid;place-items:center}
.lib-item-thumb img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.lib-item-thumb-emoji{font-size:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))}
.lib-item-type{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;box-shadow:var(--clay-shadow),3px 4px 8px rgba(0,0,0,.18);backdrop-filter:blur(8px)}
.lib-item-type.image{background:rgba(168,200,255,.92);color:#1a2a6a}
.lib-item-type.youtube{background:rgba(255,70,70,.92);color:#fff}
/* Play overlay */
.lib-item-play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.22);transition:background .25s}
.lib-item:hover .lib-item-play{background:rgba(0,0,0,.38)}
.lib-item-play-btn{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:var(--clay-shadow),6px 8px 16px rgba(0,0,0,.28);display:grid;place-items:center;color:#c0241e;transition:transform .25s}
.lib-item:hover .lib-item-play-btn{transform:scale(1.1)}

/* Card body */
.lib-item-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.lib-item-title{font-weight:700;font-size:15px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lib-item-desc{color:var(--ink-soft);font-size:13px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:36px;flex:1}
.lib-item-foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(0,0,0,.05);padding-top:10px}
.lib-item-meta{font-size:10px;letter-spacing:1.5px;color:var(--ink-mute);text-transform:uppercase;font-weight:700}
.lib-item-open{color:var(--accent);font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:4px;transition:gap .2s}
.lib-item:hover .lib-item-open{gap:8px}

/* ── Empty / loading ── */
.lib-empty{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--neu-in-sm);padding:60px 30px;text-align:center;color:var(--ink-mute)}
.lib-empty-em{font-size:48px;margin-bottom:12px}
.lib-empty-h{font-family:'Fraunces',serif;font-size:22px;color:var(--ink);margin-bottom:6px}
.lib-empty-p{font-size:14px}

/* ── Modal ── */
.lib-modal-scrim{position:fixed;inset:0;z-index:50;background:rgba(30,30,60,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s ease}
.lib-modal-scrim.open{opacity:1;pointer-events:auto}
.lib-modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:20px 20px 60px rgba(60,40,120,.3),-20px -20px 60px rgba(255,255,255,.6);width:100%;max-width:600px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;transform:translateY(20px) scale(.96);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1)}
.lib-modal-scrim.open .lib-modal{transform:translateY(0) scale(1)}
.lib-modal-thumb{height:260px;position:relative;overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.lib-modal-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.lib-modal-thumb-emoji{font-size:90px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.3))}
.lib-modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.95);box-shadow:var(--neu-out-sm);display:grid;place-items:center;color:var(--ink);z-index:2}
.lib-modal-body{padding:20px 22px 24px;overflow-y:auto}
.lib-modal-tag{display:inline-block;padding:5px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.lib-modal-tag.image{background:rgba(168,200,255,.9);color:#1a2a6a}
.lib-modal-tag.youtube{background:rgba(255,70,70,.9);color:#fff}
.lib-modal-title{font-family:'Fraunces',serif;font-size:24px;font-weight:700;letter-spacing:-.4px;margin:0 0 8px;line-height:1.2}
.lib-modal-desc{color:var(--ink-soft);font-size:14px;line-height:1.55;margin-bottom:18px}
.lib-modal-embed{width:100%;aspect-ratio:16/9;border-radius:14px;border:0;box-shadow:var(--neu-out-sm);margin-bottom:18px}
.lib-modal-img{width:100%;border-radius:14px;display:block;margin-bottom:18px;box-shadow:var(--neu-out-sm)}
.lib-modal-actions{display:flex;gap:10px}
.lib-btn{flex:1;border:0;cursor:pointer;padding:13px 18px;border-radius:var(--r-md);font:inherit;font-weight:700;font-size:14px;background:var(--surface);color:var(--ink);box-shadow:var(--neu-out-sm);transition:all .2s;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.lib-btn:active{box-shadow:var(--neu-press)}
.lib-btn.primary{background:linear-gradient(160deg,var(--accent-soft),var(--accent));color:#fff;box-shadow:var(--clay-shadow),6px 8px 16px rgba(108,92,231,.35)}

@media(max-width:600px){
  .lib-cat{padding:14px;border-radius:22px}
  .lib-cat-emoji{width:44px;height:44px;font-size:22px;border-radius:14px}
  .lib-cat-title{font-size:18px}
  .lib-cat-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .lib-item-thumb-emoji{font-size:48px}
  .lib-item-body{padding:12px}
  .lib-item-title{font-size:14px}
  .lib-item-desc{font-size:12px}
  .lib-modal-thumb{height:200px}
  .lib-modal-thumb-emoji{font-size:72px}
}
</style>
</head>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs }
  from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const myPhone = localStorage.getItem("ff_phone");
if (!myPhone) location.replace("login.html");

// ── Category emoji/colour palettes ───────────────────────────────────────────
const CAT_EMOJIS = ["📖","🏃","🌿","🎯","📝","🕌","💡","🌙","📌","🌸"];
const CAT_BGS = [
  "linear-gradient(160deg,#ffe08a,#ffb347)",
  "linear-gradient(160deg,#ffc89a,#ff8a5b)",
  "linear-gradient(160deg,#a8e6cf,#4cbf94)",
  "linear-gradient(160deg,#c5b3ff,#8a7aff)",
  "linear-gradient(160deg,#a8c8ff,#6c8eff)",
  "linear-gradient(160deg,#ff9eb3,#ff5a7a)",
  "linear-gradient(160deg,#ffe08a,#e8a020)",
  "linear-gradient(160deg,#a8e6cf,#2aa878)",
  "linear-gradient(160deg,#ffc89a,#d07040)",
  "linear-gradient(160deg,#c5b3ff,#6c5ce7)",
];

// ── State ─────────────────────────────────────────────────────────────────────
let allItems = [], allTasks = [], activeFilter = "all", searchQ = "";

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadData() {
  allTasks=[];allItems=[];
  try{
    const [tSnap,rSnap]=await Promise.all([getDocs(collection(db,"tasks")),getDocs(collection(db,"resources"))]);
    tSnap.forEach(d=>allTasks.push({id:d.id,...d.data()}));
    rSnap.forEach(d=>allItems.push({id:d.id,...d.data()}));
    allTasks.sort((a,b)=>(a.text||"").localeCompare(b.text||""));
  }catch(e){
    // tasks may not exist - try resources alone
    try{const r=await getDocs(collection(db,"resources"));r.forEach(d=>allItems.push({id:d.id,...d.data()}));}
    catch(e2){console.error("Library:",e2);}
  }
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById("libRoot");
  root.innerHTML = "";

  const q = searchQ.toLowerCase();
  const filtered = allItems.filter(r => {
    const type = (r.type||"").toLowerCase();
    if (activeFilter === "article" && type !== "article" && type !== "image") return false;
    if (activeFilter === "youtube" && type !== "youtube") return false;
    if (q && !(r.title||"").toLowerCase().includes(q) && !(r.description||"").toLowerCase().includes(q)) return false;
    return true;
  });

  // Count badge
  const grouped = {}, order = [];
  filtered.forEach(r => {
    const key = r.taskId || "__none__";
    if (!grouped[key]) { grouped[key] = []; order.push(key); }
    grouped[key].push(r);
  });
  const catCount = order.filter(k => grouped[k].length > 0).length;
  document.getElementById("resourceCount").textContent =
    filtered.length + " item" + (filtered.length !== 1 ? "s" : "") + " · " + catCount + " categor" + (catCount === 1 ? "y" : "ies");

  if (!filtered.length) {
    root.innerHTML = `<div class="lib-empty"><div class="lib-empty-em">🔍</div><div class="lib-empty-h">${q ? "Nothing matches" : "No resources yet"}</div><div class="lib-empty-p">${q ? "Try a different search or filter." : "Check back soon."}</div></div>`;
    return;
  }

  order.forEach((taskId, idx) => {
    const items = grouped[taskId];
    if (!items || !items.length) return;
    const taskObj = allTasks.find(t => t.id === taskId);
    const title = taskObj ? (taskObj.text || "General") : "General";
    const emoji = CAT_EMOJIS[idx % CAT_EMOJIS.length];
    const bg = CAT_BGS[idx % CAT_BGS.length];

    const sec = document.createElement("section");
    sec.className = "lib-cat";

    // Header
    const head = document.createElement("div");
    head.className = "lib-cat-head";
    head.innerHTML = `
      <div class="lib-cat-emoji" style="background:${bg}">${emoji}</div>
      <div class="lib-cat-info">
        <div class="lib-cat-title">${escHtml(title)}</div>
        <div class="lib-cat-meta">${items.length} item${items.length!==1?"s":""} · curated by your group</div>
      </div>
      <button class="lib-cat-toggle" type="button" aria-label="Toggle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>`;
    head.addEventListener("click", () => sec.classList.toggle("collapsed"));

    // Grid
    const grid = document.createElement("div");
    grid.className = "lib-cat-grid";
    items.forEach(r => grid.appendChild(makeCard(r)));

    sec.appendChild(head);
    sec.appendChild(grid);
    root.appendChild(sec);
  });
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function escHtml(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function ytId(url){const m=(url||"").match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m?m[1]:null;}

// ── Make card ────────────────────────────────────────────────────────────────
function makeCard(r){
  const type=(r.type||"article").toLowerCase();
  const isYT=type==="youtube";
  const vid=isYT?ytId(r.url||r.link||""):null;
  const thumb=isYT&&vid?`https://img.youtube.com/vi/${vid}/mqdefault.jpg`:(r.imageUrl||r.thumbnail||"");
  const btn=document.createElement("button");
  btn.className="lib-item";
  const thumbBg=isYT?"linear-gradient(160deg,#ff9eb3,#ff5a7a)":"linear-gradient(160deg,var(--clay-sky),#6c8eff)";
  btn.innerHTML=`
    <div class="lib-item-thumb" style="background:${thumbBg}">
      ${thumb?`<img src="${escHtml(thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">`:""}
      <div class="lib-item-thumb-emoji">${isYT?"▶️":"📄"}</div>
      <span class="lib-item-type ${isYT?"youtube":"image"}">${isYT?"YouTube":"Article"}</span>
      ${isYT?`<div class="lib-item-play"><div class="lib-item-play-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="#c0241e"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div>`:""}
    </div>
    <div class="lib-item-body">
      <div class="lib-item-title">${escHtml(r.title||"Untitled")}</div>
      <div class="lib-item-desc">${escHtml(r.description||r.desc||"")}</div>
      <div class="lib-item-foot">
        <span class="lib-item-meta">${isYT?"Watch":"Read"}</span>
        <span class="lib-item-open">Open →</span>
      </div>
    </div>`;
  btn.addEventListener("click",()=>openModal(r));
  return btn;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(r){
  const type=(r.type||"article").toLowerCase();
  const isYT=type==="youtube";
  const vid=isYT?ytId(r.url||r.link||""):null;
  const thumb=isYT&&vid?`https://img.youtube.com/vi/${vid}/mqdefault.jpg`:(r.imageUrl||r.thumbnail||"");
  const link=r.url||r.link||"#";
  const thumbBg=isYT?"linear-gradient(160deg,#ff9eb3,#ff5a7a)":"linear-gradient(160deg,var(--clay-sky),#6c8eff)";
  const modal=document.getElementById("libModal");
  if(isYT&&vid){
    modal.innerHTML=`
      <div style="position:relative;border-radius:var(--r-lg) var(--r-lg) 0 0;overflow:hidden;background:#000;padding-top:56.25%">
        <iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        <button class="lib-modal-close" onclick="closeModal()" style="position:absolute;top:10px;right:10px">✕</button>
      </div>
      <div class="lib-modal-body">
        <span class="lib-modal-tag youtube">YouTube</span>
        <div class="lib-modal-title">${escHtml(r.title||"Untitled")}</div>
        <div class="lib-modal-desc">${escHtml(r.description||r.desc||"")}</div>
        <div class="lib-modal-actions"><a class="lib-btn primary" href="${escHtml(link)}" target="_blank" rel="noopener">Open on YouTube ↗</a></div>
      </div>`;
  } else {
    modal.innerHTML=`
      <div class="lib-modal-thumb" style="background:${thumbBg};border-radius:var(--r-lg) var(--r-lg) 0 0">
        ${thumb?`<img src="${escHtml(thumb)}" alt="" onerror="this.style.display='none'">`:`<div class="lib-modal-thumb-emoji">📄</div>`}
        <button class="lib-modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="lib-modal-body">
        <span class="lib-modal-tag image">Article</span>
        <div class="lib-modal-title">${escHtml(r.title||"Untitled")}</div>
        <div class="lib-modal-desc">${escHtml(r.description||r.desc||"")}</div>
        ${thumb?`<img class="lib-modal-img" src="${escHtml(thumb)}" alt="">`:""}
        <div class="lib-modal-actions"><a class="lib-btn primary" href="${escHtml(link)}" target="_blank" rel="noopener">Open Article ↗</a></div>
      </div>`;
  }
  document.getElementById("libScrim").classList.add("open");
}
window.closeModal=()=>document.getElementById("libScrim").classList.remove("open");
document.getElementById("libScrim").addEventListener("click",e=>{if(e.target===document.getElementById("libScrim"))window.closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")window.closeModal();});

// ── Search & filter ───────────────────────────────────────────────────────────
document.getElementById("searchInput").addEventListener("input",e=>{searchQ=e.target.value.trim();render();});
document.querySelectorAll(".lib-fbtn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".lib-fbtn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");activeFilter=b.dataset.filter;render();
}));

loadData().catch(e=>{
  console.error("Library load:",e);
  document.getElementById("libRoot").innerHTML='<div class="lib-empty"><div class="lib-empty-em">⚠️</div><div class="lib-empty-h">Could not load</div><div class="lib-empty-p">Check your connection and refresh.</div></div>';
});
</script>
</body>
</html>
