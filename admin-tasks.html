<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Tasks | Faith &amp; Fitness</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f1f5f9;min-height:100vh}
.wrap{display:flex;min-height:100vh}
#adminSidebar{flex-shrink:0}
.main{flex:1;padding:20px;overflow-x:hidden}

.page-title{font-size:20px;font-weight:bold;color:#14532d;margin-bottom:18px}
.section-title{
  font-size:12px;font-weight:bold;letter-spacing:.8px;
  color:#64748b;text-transform:uppercase;margin-bottom:12px;
}
.card{
  background:#fff;border-radius:12px;padding:18px;
  margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* Form grid */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.field-row{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:12px;font-weight:bold;color:#475569}
input[type=text],input[type=number],input[type=time]{
  width:100%;padding:9px 12px;
  border:1.5px solid #e2e8f0;border-radius:7px;
  font-size:14px;outline:none;
}
input:focus{border-color:#16a34a}

/* Days checkboxes */
.days-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.day-toggle{
  padding:6px 10px;border:1.5px solid #e2e8f0;
  border-radius:6px;font-size:12px;font-weight:bold;
  cursor:pointer;background:#f8fafc;color:#475569;
  user-select:none;transition:all .15s;
}
.day-toggle.on{background:#16a34a;color:#fff;border-color:#16a34a}

/* Buttons */
.btn{padding:9px 18px;border:none;border-radius:7px;font-size:13px;font-weight:bold;cursor:pointer}
.btn-green{background:#16a34a;color:#fff}
.btn-green:hover{opacity:.88}
.btn-gray{background:#f1f5f9;color:#475569}
.form-actions{display:flex;gap:8px;margin-top:12px}
.form-actions .btn{flex:1}

/* Task cards list */
.task-item{
  border:1.5px solid #e2e8f0;border-radius:10px;
  padding:14px;margin-bottom:10px;
  display:flex;gap:12px;align-items:flex-start;
  background:#fafafa;
}
.task-item:last-child{margin-bottom:0}
.task-item-body{flex:1}
.task-item-name{font-weight:bold;font-size:15px;color:#1e293b;margin-bottom:4px}
.task-item-meta{font-size:12px;color:#64748b;display:flex;gap:10px;flex-wrap:wrap}
.task-item-pts{
  font-size:14px;font-weight:bold;color:#16a34a;
  flex-shrink:0;margin-left:auto;white-space:nowrap;
}
.task-item-pts.zero{color:#94a3b8}
.task-days{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.day-badge{
  padding:2px 7px;border-radius:5px;font-size:11px;font-weight:bold;
  background:#dcfce7;color:#16a34a;
}
.task-actions{display:flex;gap:6px;margin-top:8px}
.btn-sm{
  padding:5px 10px;border:none;border-radius:5px;
  font-size:12px;font-weight:bold;cursor:pointer;
}
.btn-edit-t{background:#0284c7;color:#fff}
.btn-del-t{background:#dc2626;color:#fff}

/* Tab bar */
.tab-bar{display:flex;border-radius:10px;overflow:hidden;border:1.5px solid #e2e8f0;margin-bottom:18px;background:#f8fafc}
.tab-btn{flex:1;padding:10px 4px;text-align:center;font-size:13px;font-weight:bold;cursor:pointer;border:none;background:transparent;color:#64748b;transition:all .15s}
.tab-btn.active{background:#16a34a;color:#fff}

/* Save msg */
.save-msg{font-size:13px;text-align:center;margin-top:8px;min-height:18px}
.save-msg.ok{color:#16a34a}
.save-msg.err{color:#dc2626}

/* Special tasks placeholder */
.special-placeholder{text-align:center;padding:48px 20px;color:#94a3b8}
.special-placeholder span{font-size:42px;display:block;margin-bottom:10px}
.special-placeholder p{font-size:14px}

/* Empty */
.empty-tasks{text-align:center;padding:28px;color:#94a3b8;font-size:14px}
.empty-tasks span{font-size:36px;display:block;margin-bottom:8px}

@media(max-width:700px){.wrap{flex-direction:column}.form-grid{grid-template-columns:1fr}}
</style>
<!-- OneSignal Push Notifications -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "05d57d24-d6bc-40ab-8549-ea6dcf506070",
      safari_web_id: "web.onesignal.auto.261dc44c-6b5c-4882-ba5f-51ef0736d918",
      notifyButton: { enable: true },
    });
  });
</script>
</head>
<body>
<div class="wrap">
  <div id="adminSidebar"></div>

  <main class="main">
    <div class="page-title">📋 Task Manager</div>

    <!-- ── Tab bar ── -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-regular" onclick="switchTab('regular',this)">📋 Regular Tasks</button>
      <button class="tab-btn"        id="tab-special" onclick="switchTab('special',this)">⭐ Special Tasks</button>
    </div>

    <!-- ── Regular Tasks section ── -->
    <div id="section-regular">

    <!-- ── Create / Edit Form ── -->
    <div class="card">
      <div class="section-title" id="formTitle">Create New Task</div>
      <div class="form-grid">

        <div class="field-row full">
          <label class="field-label">Task Text</label>
          <input type="text" id="f_text" placeholder="e.g. Morning prayer completed ✅">
        </div>

        <div class="field-row">
          <label class="field-label">Points</label>
          <input type="number" id="f_points" placeholder="e.g. 10" min="0">
        </div>

        <div class="field-row">
          <label class="field-label">Start Time</label>
          <input type="time" id="f_start" value="20:00">
        </div>

        <div class="field-row">
          <label class="field-label">End Time (next day)</label>
          <input type="time" id="f_end" value="12:00">
        </div>

        <div class="field-row">
          <label class="field-label">Start Date (optional — leave blank for recurring)</label>
          <input type="date" id="f_start_date" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:14px;outline:none">
        </div>

        <div class="field-row">
          <label class="field-label">End Date (optional)</label>
          <input type="date" id="f_end_date" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:14px;outline:none">
        </div>

        <div class="field-row full">
          <label class="field-label">Working Days (leave all unchecked = every day)</label>
          <div class="days-grid" id="daysGrid">
            <span class="day-toggle" data-day="1">Mon</span>
            <span class="day-toggle" data-day="2">Tue</span>
            <span class="day-toggle" data-day="3">Wed</span>
            <span class="day-toggle" data-day="4">Thu</span>
            <span class="day-toggle" data-day="5">Fri</span>
            <span class="day-toggle" data-day="6">Sat</span>
            <span class="day-toggle" data-day="0">Sun</span>
          </div>
        </div>

      </div>

      <div class="form-actions">
        <button class="btn btn-gray" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
        <button class="btn btn-green" onclick="saveTask()">Save Task</button>
      </div>
      <div class="save-msg" id="formMsg"></div>
    </div>

    <!-- ── Task list ── -->
    <div class="card">
      <div class="section-title">All Tasks (<span id="taskCount">0</span>)</div>
      <div id="taskList">Loading…</div>
    </div>

    </div><!-- end #section-regular -->

    <!-- ── Special Tasks section ── -->
    <div id="section-special" style="display:none">
      <div class="card">
        <div class="special-placeholder">
          <span>⭐</span>
          <p><b>Special Tasks</b> coming soon.</p>
          <p style="margin-top:6px;font-size:12px">This section will be used for one-off or featured tasks.</p>
        </div>
      </div>
    </div>

  </main>
</div>

<script type="module">
import "./admin-nav.js";
import { db } from "./firebase.js";
import {
  collection, getDocs, addDoc, updateDoc, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let editId      = null;
let activeDays  = new Set();

/* ── Day toggles ── */
document.querySelectorAll(".day-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    const d = Number(btn.dataset.day);
    if(activeDays.has(d)){ activeDays.delete(d); btn.classList.remove("on"); }
    else                  { activeDays.add(d);    btn.classList.add("on"); }
  });
});

/* ── Load tasks ── */
async function loadTasks(){
  const snap = await getDocs(collection(db,"tasks"));
  const list = document.getElementById("taskList");
  document.getElementById("taskCount").textContent = snap.size;

  if(snap.empty){
    list.innerHTML = `<div class="empty-tasks"><span>📋</span>No tasks yet. Create the first one above!</div>`;
    return;
  }

  // Sort by points desc
  const items = [];
  snap.forEach(d => items.push({id:d.id,...d.data()}));
  items.sort((a,b)=>(b.points||0)-(a.points||0));

  list.innerHTML = "";
  items.forEach(t => {
    const daysLabel = (t.days && t.days.length > 0)
      ? t.days.sort((a,b)=>a-b).map(d => `<span class="day-badge">${DAY_NAMES[d]}</span>`).join("")
      : '<span class="day-badge" style="background:#f1f5f9;color:#64748b">Every day</span>';

    const timeLabel = (t.start && t.end)
      ? `⏰ ${t.start} – ${t.end}`
      : "No time restriction";
    const dateLabel = (t.startDate || t.endDate)
      ? `📅 ${t.startDate||"?"} → ${t.endDate||"ongoing"}`
      : "";

    const div = document.createElement("div");
    div.className = "task-item";
    div.innerHTML = `
      <div class="task-item-body">
        <div class="task-item-name">${escHtml(t.text)}</div>
        <div class="task-item-meta">
          <span>${timeLabel}</span>
          ${dateLabel?`<span>${dateLabel}</span>`:""}
        </div>
        <div class="task-days">${daysLabel}</div>
        <div class="task-actions">
          <button class="btn-sm btn-edit-t" onclick='openEdit(${JSON.stringify({id:t.id,text:t.text,points:t.points,start:t.start||"",end:t.end||"",startDate:t.startDate||"",endDate:t.endDate||"",days:t.days||[]})})'>Edit</button>
          <button class="btn-sm btn-del-t" onclick="deleteTask('${t.id}')">Delete</button>
        </div>
      </div>
      <div class="task-item-pts ${(t.points||0)===0?"zero":""}">
        ${(t.points||0)>0 ? "+"+t.points+" pts" : "0 pts"}
      </div>
    `;
    list.appendChild(div);
  });
}
loadTasks();

/* ── Save task ── */
window.saveTask = async () => {
  const msg       = document.getElementById("formMsg");
  const text      = document.getElementById("f_text").value.trim();
  const points    = Number(document.getElementById("f_points").value);
  const start     = document.getElementById("f_start").value;
  const end       = document.getElementById("f_end").value;
  const startDate = document.getElementById("f_start_date").value;
  const endDate   = document.getElementById("f_end_date").value;

  if(!text){ msg.textContent="Task text is required."; msg.className="save-msg err"; return; }
  if(isNaN(points)||points<0){ msg.textContent="Enter a valid points value (0 or more)."; msg.className="save-msg err"; return; }

  const data = {
    text,
    points,
    start:     start     || null,
    end:       end       || null,
    startDate: startDate || null,
    endDate:   endDate   || null,
    days:      activeDays.size > 0 ? [...activeDays] : []
  };

  if(editId){
    await updateDoc(doc(db,"tasks",editId), data);
    msg.textContent = "Task updated ✅";
    if(window.logAdminAction) logAdminAction("Edited task", `"${text}" (${points} pts)`);
  } else {
    data.createdAt = new Date().toISOString();
    await addDoc(collection(db,"tasks"), data);
    msg.textContent = "Task created ✅";
    if(window.logAdminAction) logAdminAction("Created task", `"${text}" (${points} pts)`);
  }

  msg.className = "save-msg ok";
  cancelEdit();
  loadTasks();
};

/* ── Open edit ── */
window.openEdit = (t) => {
  editId = t.id;
  document.getElementById("formTitle").textContent   = "Edit Task";
  document.getElementById("cancelBtn").style.display = "block";
  document.getElementById("f_text").value       = t.text || "";
  document.getElementById("f_points").value     = t.points ?? "";
  document.getElementById("f_start").value      = t.start || "";
  document.getElementById("f_end").value        = t.end   || "";
  document.getElementById("f_start_date").value = t.startDate || "";
  document.getElementById("f_end_date").value   = t.endDate   || "";

  activeDays = new Set((t.days||[]).map(Number));
  document.querySelectorAll(".day-toggle").forEach(btn => {
    btn.classList.toggle("on", activeDays.has(Number(btn.dataset.day)));
  });

  window.scrollTo({top:0,behavior:"smooth"});
};

/* ── Cancel edit ── */
window.cancelEdit = () => {
  editId = null;
  activeDays = new Set();
  document.getElementById("formTitle").textContent   = "Create New Task";
  document.getElementById("cancelBtn").style.display = "none";
  document.getElementById("f_text").value       = "";
  document.getElementById("f_points").value     = "";
  document.getElementById("f_start").value      = "20:00";
  document.getElementById("f_end").value        = "12:00";
  document.getElementById("f_start_date").value = "";
  document.getElementById("f_end_date").value   = "";
  document.querySelectorAll(".day-toggle").forEach(b=>b.classList.remove("on"));
  document.getElementById("formMsg").textContent = "";
};

/* ── Delete task ── */
window.deleteTask = async (id) => {
  if(!confirm("Delete this task? This cannot be undone.")) return;
  await deleteDoc(doc(db,"tasks",id));
  loadTasks();
};

function escHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ── Tab switching ── */
window.switchTab = (tab, btn) => {
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("section-regular").style.display = tab==="regular" ? "block" : "none";
  document.getElementById("section-special").style.display = tab==="special" ? "block" : "none";
};
</script>
</body>
</html>
